    </div>
    <div class="checks"><span class="muted">ảnh 3 góc (jpg, png). ảnh cận làm ảnh bìa trên thẻ lineup.</span></div>
    <div class="angles">${ANGLES.map(([k,l])=>{const pid=photosOf(e)[k];return `<label class="angle">${pid?`<img src="${esc(pid)}" alt="" onerror="this.style.visibility='hidden'">`:`<div class="blank">chưa có ảnh</div>`}<b style="color:var(--paper)">góc ${esc(l)}</b><input id="f_ph_${k}" type="file" accept="image/*"></label>`}).join("")}</div>
    <label class="f">tài năng, năng khiếu (cách nhau bằng dấu phẩy)<input id="f_tal" maxlength="200" value="${esc((e.talents||[]).join(", "))}" placeholder="pha cocktail, nhảy, tiếng anh"></label>
    <label class="f">sở trường (cách nhau bằng dấu phẩy, tối đa 4)<input id="f_forte" maxlength="160" value="${esc((e.forte||[]).join(", "))}" placeholder="giữ bàn đông người, khách nước ngoài"></label>
    <div class="checks"><span class="muted">cho khách thấy:</span>
      <label><input type="checkbox" id="s_h" ${sh.height?"checked":""}> chiều cao</label>
      <label><input type="checkbox" id="s_w" ${sh.weight?"checked":""}> cân nặng</label>
      <label><input type="checkbox" id="s_m" ${sh.measurements?"checked":""}> số đo 3 vòng</label>
    </div>
    <div class="consent"><strong>đồng ý hiển thị</strong>
      <div class="checks">
        <label><input type="checkbox" id="c_s" ${c.signed?"checked":""}> promoter đã ký giấy đồng ý cho quán hiển thị ảnh và các thông tin đã tick ở trên, và biết có thể rút lại bất cứ lúc nào</label>
        <label><input type="checkbox" id="c_a" ${c.adult?"checked":""}> đã kiểm tra giấy tờ, promoter đủ 18 tuổi</label>
        <label><input type="checkbox" id="c_act" ${e.active!==false?"checked":""}> đang làm ở quán</label>
      </div>
    </div>
    <div class="err" id="formErr" role="alert"></div>
    <div class="rowbtns"><button class="cta" type="submit" id="saveIdol">lưu hồ sơ</button>${e.id?`<button type="button" class="ghostbtn danger" id="delIdol">xoá hồ sơ</button><span class="muted" id="delNote"></span>`:""}</div>
  </form>`;
  document.getElementById("closeForm").onclick=()=>{S.editing=null;slot.innerHTML=""};
  document.getElementById("idolForm").onsubmit=saveIdol;
  const del=document.getElementById("delIdol");
  if(del){let armed=false;del.onclick=async()=>{
    if(!armed){armed=true;del.textContent="bấm lần nữa để xoá";document.getElementById("delNote").textContent="lượt chấm cũ vẫn giữ.";return}
    try{await S.db.doc("idols/"+e.id).delete();S.editing=null;render()}catch(_){document.getElementById("formErr").textContent="chưa xoá được, thử lại."}
  }}
}
async function saveIdol(ev){
  ev.preventDefault();
  const v=id=>document.getElementById(id).value.trim();
  const ck=id=>document.getElementById(id).checked;
  const err=document.getElementById("formErr");const btn=document.getElementById("saveIdol");
  const num=x=>x.replace(/\D/g,"");
  const name=v("f_name");if(!name){err.textContent="cần tên hiển thị.";return}
  const e=S.editing||{};const id=e.id||("i"+rid(10));
  btn.disabled=true;btn.textContent="đang lưu…";err.textContent="";
  const photos=photosOf(e);
  const files=ANGLES.map(([k])=>[k,document.getElementById("f_ph_"+k).files[0]]).filter(([,f])=>f);
  try{
    if(files.length&&!S.assets){err.textContent="tài khoản này không tải ảnh lên được.";btn.disabled=false;btn.textContent="lưu hồ sơ";return}
    for(const [k,f] of files){
      btn.textContent="đang tải ảnh "+(ANGLES.find(a=>a[0]===k)||[,k])[1]+"…";
      const up=await S.assets.upload(f,f.type?undefined:{type:"image/jpeg"});photos[k]=up.id;
    }
    btn.textContent="đang lưu…";
    const prevConsent=e.consent||{};
    const signed=ck("c_s"),adult=ck("c_a");
    const body={id,stageName:name.slice(0,40),team:v("f_team").slice(0,40),
      height:num(v("f_h")),weight:num(v("f_w")),bust:num(v("f_b")),waist:num(v("f_wa")),hip:num(v("f_hi")),
      talents:v("f_tal").split(",").map(s=>s.trim()).filter(Boolean).slice(0,12),
      forte:v("f_forte").split(",").map(s=>s.trim()).filter(Boolean).slice(0,4),
      show:{height:ck("s_h"),weight:ck("s_w"),measurements:ck("s_m")},
      consent:{signed,adult,at:(signed&&adult)?(prevConsent.signed&&prevConsent.adult?prevConsent.at:Date.now()):null},
      active:ck("c_act"),photos,createdAt:e.createdAt||Date.now(),updatedAt:Date.now()};
    await S.db.doc("idols/"+id).set(body);
    S.editing=null;render();
  }catch(x){
    btn.disabled=false;btn.textContent="lưu hồ sơ";
    err.textContent=x&&x.code==="type_not_allowed"?"định dạng ảnh không hỗ trợ, dùng jpg hoặc png.":(x&&x.code==="too_large"?"ảnh quá nặng, tối đa 20 MB.":"chưa lưu được, thử lại.");
  }
}
/* hồ sơ lưu trước 09/11 còn để ảnh to trong hồ sơ công khai: máy quản lý tự lưu lại một lần theo cách mới */
const MIGRATING={};
function migrateThumbs(){
  if(!S.canEdit||!S.db||!S.db.thumbV)return;
  S.idols.filter(i=>Object.keys(i.photos||{}).length&&i.thumbV!==S.db.thumbV&&!MIGRATING[i.id]).forEach(i=>{
    MIGRATING[i.id]=1;S.db.doc("idols/"+i.id).set({...i}).catch(()=>{delete MIGRATING[i.id]});
  });
}
function modSet(id,patch){const cur=S.mod[id]||{};return S.db.doc("moderation/"+id).set({hidden:!!cur.hidden,...patch,at:Date.now()})}
function adminReviews(p){
  const name={};S.idols.forEach(i=>name[i.id]=i.stageName);
  const rv=S.reviews.slice().sort((a,b)=>b.createdAt-a.createdAt).slice(0,300);
  const pend=rv.reduce((a,r)=>{const n=S.notes[r.id];return a+(n&&n.tip&&!n.tipAdded?n.tip:0)},0);
  p.innerHTML=rv.length?`<div class="rowbtns"><span class="pill warn">tip chờ cộng vào bill: ${vnd(pend)}</span><span class="note">sao từ 3 trở xuống, tag góp ý, lời nhắn và tip chỉ hiện ở đây. ẩn một lượt thì nó không còn tính vào điểm.</span></div>
  <div class="table"><table class="rvtable"><colgroup><col style="width:78px"><col style="width:124px"><col style="width:48px"><col class="w-tag"><col class="w-txt"><col class="w-txt"><col style="width:98px"><col style="width:104px"><col style="width:132px"></colgroup><thead><tr><th>lúc</th><th>promoter</th><th class="num">sao</th><th>tag</th><th>nhận xét công khai</th><th>lời nhắn cho promoter</th><th class="num">tip</th><th>bàn</th><th></th></tr></thead><tbody>
  ${rv.map(r=>{const m=S.mod[r.id]||{};const n=S.notes[r.id]||{};const tags=[...(r.tags||[]),...(n.negTags||[])];return `<tr style="${m.hidden?"opacity:.45":""}">
    <td class="muted" data-l="lúc">${ago(r.createdAt)}</td><td data-l="promoter"><b>${esc(name[r.idolId]||"(đã xoá)")}</b></td>
    <td class="num" data-l="sao" style="color:${r.stars<=3?"var(--bad-text)":"inherit"}">${r.stars}</td>
    <td class="wide" data-l="tag">${tags.length?"":"-"}<div class="clamp3 taglines">${tags.map(t=>`<span class="tag${NEG_TAGS.includes(t)?" bad":""}">${esc(t)}</span>`).join("")}</div></td>
    <td class="wide${r.comment?"":" empty-m"}" data-l="nhận xét công khai"><div class="clamp3">${esc(r.comment||"")}</div></td>
    <td class="wide${n.comment?"":" empty-m"}" data-l="lời nhắn cho promoter"><div class="clamp3">${esc(n.comment||"")}</div></td>
    <td class="num" data-l="tip">${n.tip?vnd(n.tip):"-"}</td><td class="muted nowrap" data-l="bàn">${esc(n.table||"")}${n.code?`<br>${esc(n.code)}`:""}</td>
    <td><div class="rowbtns">${n.tip?`<button class="ghostbtn" data-tip="${esc(r.id)}" data-v="${n.tipAdded?1:0}">${n.tipAdded?"✓ đã cộng":"đã cộng vào bill"}</button>`:""}<button class="ghostbtn" data-hide="${esc(r.id)}" data-h="${m.hidden?1:0}">${m.hidden?"hiện lại":"ẩn"}</button></div></td></tr>`}).join("")}
  </tbody></table></div>`:`<div class="empty"><b>chưa có đánh giá nào.</b><span>khi khách đánh giá trên tablet lúc tính tiền, nó hiện ở đây ngay, kèm tip cần cộng vào bill.</span></div>`;
  /* ô dài quá 3 dòng: cắt bớt, bấm vào để xem hết / thu lại */
  p.querySelectorAll(".rvtable .clamp3").forEach(c=>{if(c.scrollHeight>c.clientHeight+2){c.classList.add("more");c.title="bấm để xem hết";c.onclick=()=>c.classList.toggle("open")}});
  p.querySelectorAll("[data-hide]").forEach(b=>b.onclick=async()=>{b.disabled=true;try{await modSet(b.dataset.hide,{hidden:b.dataset.h!=="1"})}catch(_){b.disabled=false}});
  p.querySelectorAll("[data-tip]").forEach(b=>b.onclick=async()=>{b.disabled=true;try{await S.db.doc("notes/"+b.dataset.tip).update({tipAdded:b.dataset.v!=="1"})}catch(_){b.disabled=false}});
}

/* ---------- boot ---------- */
render();
(async function boot(){
  const cl=window.claude;
  if(!cl||!cl.use){S.dbMissing=true;S.loaded.idols=true;render();return}
  const [db,user,assets]=await Promise.all([cl.use("db"),cl.use("user"),cl.use("assets")]);
  S.db=db;S.user=user;S.assets=assets;
  if(user){try{S.canEdit=await user.canEdit()}catch(_){}try{S.canWrite=await user.can("data.write")}catch(_){}try{S.authEmail=await user.email()}catch(_){}}
  if(!db){S.dbMissing=true;S.loaded.idols=true;render();return}
  const timer=setTimeout(()=>{S.stale=true;render()},10000);
  const settle=snap=>{if(!snap.metadata.fromCache){clearTimeout(timer);if(S.stale){S.stale=false}}};
  const onErr=()=>{clearTimeout(timer);S.stale=true;S.loaded.idols=true;render()};
  let rT=0;const soon=()=>{clearTimeout(rT);rT=setTimeout(()=>{if(!isTyping())render()},60)};
  function isTyping(){const a=document.activeElement;return a&&(a.tagName==="INPUT"||a.tagName==="TEXTAREA")&&route().view!=="lineup"}
  db.collection("idols").onSnapshot(s=>{S.idols=s.docs.map(d=>({...d.data(),id:d.id}));S.loaded.idols=true;settle(s);migrateThumbs();soon()},onErr);
  db.collection("reviews").onSnapshot(s=>{S.reviews=s.docs.map(d=>({...d.data(),id:d.id})).filter(r=>r.stars>=1&&r.stars<=5);S.loaded.reviews=true;settle(s);soon()},onErr);
  db.collection("moderation").onSnapshot(s=>{const m={};s.docs.forEach(d=>m[d.id]=d.data());S.mod=m;soon()},()=>{});
  countVisitOnce();
  fetchTonight();
  if(S.canEdit&&db.watchVisits)db.watchVisits(isoOfVN(Date.now()).slice(0,8)+"01",list=>{S.visits=list;soon()},()=>{});
  if(db.watchLoads)db.watchLoads(nightInfo().iso,list=>{const m={};list.forEach(x=>{m[x.date]=x.counts||{}});S.loads=m;S.loaded.loads=true;syncLoads();soon()},()=>{S.loaded.loads=false});
  if(S.canEdit){
    db.collection("bills").onSnapshot(s=>{S.bills=s.docs.map(d=>d.data());soon()},()=>{});
    db.collection("bookings").onSnapshot(s=>{S.bookings=s.docs.map(d=>({...d.data(),id:d.id}));S.loaded.bookings=true;syncLoads();soon()},()=>{S.loaded.bookings=true});
    db.collection("notes").onSnapshot(s=>{const m={};s.docs.forEach(d=>m[d.id]=d.data());S.notes=m;soon()},()=>{});
    db.collection("venue").onSnapshot(s=>{const d=s.docs.find(x=>x.id==="tables");S.tables=d?(d.data().list||[]):DEFAULT_TABLES.slice();S.loaded.tables=true;soon()},()=>{S.tables=DEFAULT_TABLES.slice();S.loaded.tables=true});
    db.collection("redeemed").onSnapshot(s=>{const m={};s.docs.forEach(d=>m[d.id]=d.data());S.redeemed=m;soon()},()=>{});
    db.collection("vouchers").onSnapshot(s=>{S.vouchers=s.docs.map(d=>({...d.data(),id:d.id}));soon()},()=>{}); // chưa dán luật vouchers thì bỏ qua
  }
  render();
})();
})();
</script>
